<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Kanban Due Date Calendar">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://analytics.gomogi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://analytics.gomogi.com https://pb.kanvana.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Kanban Calendar</title>
  <script defer src="https://analytics.gomogi.com/script.js" data-website-id="4ebd005d-0f3f-4956-8100-a78c3d89dda8"></script>

  <script type="module" crossorigin src="./assets/calendar-g7Fho-O0.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/styles-3ZmgCy7v.js">
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-DK3Fl9T5.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-BHeUymGf.js">
  <link rel="modulepreload" crossorigin href="./assets/theme-Avmj8BPk.js">
  <link rel="stylesheet" crossorigin href="./assets/styles-sFmQo7KC.css">
</head>
<body class="reports-page calendar-page">
  <header class="rpt-header" role="banner">
    <div class="rpt-header-left">
      <span data-lucide="square-kanban" aria-hidden="true" class="rpt-logo"></span>
      <div class="rpt-header-titles">
        <h1 class="rpt-title" id="calendar-title">Calendar</h1>
        <div class="rpt-subtitle">Due dates</div>
      </div>
    </div>

    <div class="rpt-header-right" role="group" aria-label="Calendar actions">
      <div class="rpt-badge" id="calendar-board-badge" title="Active board">?</div>
      <a class="rpt-link" href="./reports.html">
        <span data-lucide="chart-column" aria-hidden="true"></span>
        <span>Reports</span>
      </a>
      <a class="rpt-link" href="./roadmap.html">
        <span data-lucide="git-branch" aria-hidden="true"></span>
        <span>Roadmap</span>
      </a>
      <a class="rpt-link" href="./index.html">
        <span data-lucide="kanban" aria-hidden="true"></span>
        <span>Back to Board</span>
      </a>
    </div>
  </header>

  <main class="rpt-main" aria-label="Due date calendar">
    <section class="reports-kpis" aria-label="Due dates calendar">
      <div class="rpt-card-header">
        <h2 class="rpt-card-title">Due dates</h2>
        <div class="rpt-controls" role="group" aria-label="Due date calendar controls">
          <button id="calendar-prev" class="control-btn" type="button" aria-label="Previous month">
            <span data-lucide="chevron-left" aria-hidden="true"></span>
            <span>Prev</span>
          </button>
          <div class="rpt-control" aria-label="Current month">
            <span id="calendar-month-label" class="rpt-due-month">–</span>
          </div>
          <button id="calendar-next" class="control-btn" type="button" aria-label="Next month">
            <span>Next</span>
            <span data-lucide="chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="rpt-due-wrap" aria-label="Due date calendar and tasks">
        <div id="calendar-grid" class="rpt-due-calendar" role="grid" aria-label="Due date month grid"></div>
        <div class="rpt-due-list" aria-label="Tasks due on selected date">
          <div id="calendar-list-title" class="rpt-due-list-title">Select a day</div>
          <ul id="calendar-list" class="rpt-due-items"></ul>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
